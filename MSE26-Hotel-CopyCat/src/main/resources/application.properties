spring.application.name=MSE26-Hotel-CopyCat
server.port=8081

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/hotelcopycat
spring.datasource.username=hoteluser
spring.datasource.password=hotelpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:8100
